name: Feature request
description: Suggest a focused improvement to ReproPack.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the diagnostic workflow that is difficult today. Privacy and non-execution boundaries are part of the product contract, so proposals that collect more data should explain the minimum data needed.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer workflow needs improvement?
      placeholder: When I review a failing command report, I cannot ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful interface and an example if possible.
    validations:
      required: true

  - type: textarea
    id: privacy
    attributes:
      label: Privacy and security considerations
      description: Does this collect, render, execute, upload, or retain any new data? If not, say why not.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What can users do today, and why is it insufficient?

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request does not depend on automatic command replay, report uploads, telemetry, or unattended issue submission.
          required: true
