name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 20
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Verify committed Action bundle
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all -- packages/action/dist)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "The committed Action bundle is out of date."
            exit 1
          fi

  maintainer-kit:
    name: Codex OSS kit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run maintainer checks
        uses: zuythu3-sudo/codex-oss-kit@v0.3.2
        with:
          checks: all
          lang: zh
